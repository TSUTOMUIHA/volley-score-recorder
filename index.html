</style></head><body><header><h1>🏐 Volley Score Recorder</h1><span class="badge">試作版 2.8</span></header><main><div class="layout"><section><div class="preview-wrap"><video id="video" playsinline muted></video><canvas id="canvas" width="1280" height="720"></canvas><div id="placeholder" class="placeholder">カメラを起動すると、映像にスコアと得点経過を重ねて表示します。<br>横向き撮影をおすすめします。</div></div><div class="status"><span><i id="dot" class="dot"></i><span id="statusText">カメラ停止中</span></span><span id="recTime">00:00</span></div><div class="panel"><div class="controls"><button id="startCamera" class="primary">カメラ起動</button><button id="startRec" class="primary" disabled>● 録画開始</button><button id="stopRec" class="stop" disabled>録画終了</button></div><button id="download" class="download hidden" type="button">写真アプリに保存する</button></div><div class="panel"><div class="settings"><label>セット終了点<select id="target"><option value="25">25点（通常セット）</option><option value="21">21点</option><option value="15">15点</option></select></label><label>最終セット終了点<select id="finalTarget"><option value="15">15点</option><option value="25">25点</option></select></label></div><p class="note">得点経過は、得点ボタンを押した順番で映像に重ねて記録します。</p></div></section><section class="right"><div class="panel"><div class="setline"><button id="prevSet">−</button><strong>第 <span id="setNo">1</span> セット</strong><button id="nextSet">＋</button></div><div class="teams"><div class="team"><input id="nameA" value="チーム A" maxlength="12"><div id="scoreA" class="score">0</div><button id="addA" class="plus">＋1 点</button></div><div class="team"><input id="nameB" value="チーム B" maxlength="12"><div id="scoreB" class="score">0</div><button id="addB" class="plus b">＋1 点</button></div></div><div class="timeout-controls"><button id="timeoutA">TOーA</button><button id="timeoutT">TTO</button><button id="timeoutB">TOーB</button></div><div class="middle" style="margin-top:12px"><span id="setsA">0セット</span><span>—</span><span id="setsB">0セット</span></div></div><div class="panel runbox"><div class="runhead"><strong>得点経過・連続得点</strong><span id="currentRun" class="streak">まだ得点はありません</span></div><div class="runrows"><div class="runlabel a"><span id="runNameA" class="runname">チーム A</span><span id="runScoreA" class="runsum">0</span></div><div id="trackA" class="runtrack"></div><div class="runlabel b"><span id="runNameB" class="runname">チーム B</span><span id="runScoreB" class="runsum">0</span></div><div id="trackB" class="runtrack"></div></div><div class="runlegend">左から得点順。数字はその得点が入った時点のチーム累積得点です。同じ段に続く数字が連続得点を表します。</div><div class="stats"><div class="stat">A 最大連続<strong id="maxA">0</strong></div><div class="stat">B 最大連続<strong id="maxB">0</strong></div></div></div><div class="panel"><div class="controls"><button id="undo">↶ 1つ戻す</button><button id="resetSet">このセットをリセット</button><button id="resetAll">試合をリセット</button></div><p class="note">「1つ戻す」で得点と得点経過を同時に訂正します。セットごとに記録を保持します。</p></div></section></div></main>
<script>
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d');let stream=null,recorder=null,chunks=[],recordedFile=null,raf=0,startedAt=0,timer=null,history=[],scores=[[0,0]],rallies=[[]],setNo=1,setWins=[0,0],cameraOn=false,endCard=false,endTimer=null,activeTimeout=null,timeoutTimer=null,timeoutSeq=0;
function current(){return scores[setNo-1]||[0,0]}function currentRallies(){return rallies[setNo-1]||[]}function ensureSet(n){while(scores.length<n){scores.push([0,0]);rallies.push([])}}
function runStats(){let last=null,run=0,max=[0,0];for(const r of currentRallies()){if(r.type==='timeout')continue;if(r.side===last)run++;else{last=r.side;run=1}max[last]=Math.max(max[last],run)}return{last,run,max}}
function timeoutLabel(t){if(t.kind==='technical')return 'テクニカル・タイムアウト';const n=t.side===0?($('nameA').value||'チームA'):($('nameB').value||'チームB');return (t.side===0?'チームA':'チームB')+' タイムアウト'}
function timeoutActive(){return activeTimeout&&currentRallies().some(r=>r.id===activeTimeout.id)}
function addTimeout(kind,side){snapshot();const ev={type:'timeout',kind,side,id:++timeoutSeq};currentRallies().push(ev);activeTimeout={id:ev.id};if(timeoutTimer)clearTimeout(timeoutTimer);timeoutTimer=setTimeout(()=>{activeTimeout=null;timeoutTimer=null;renderUI()},30000);renderUI()}
function renderUI(){let a=current()[0],b=current()[1];$('scoreA').textContent=a;$('scoreB').textContent=b;$('setNo').textContent=setNo;$('setsA').textContent=setWins[0]+'セット';$('setsB').textContent=setWins[1]+'セット';$('runNameA').textContent=$('nameA').value||'チーム A';$('runNameB').textContent=$('nameB').value||'チーム B';$('runScoreA').textContent=a;$('runScoreB').textContent=b;const ra=$('trackA'),rb=$('trackB');ra.innerHTML='';rb.innerHTML='';const all=currentRallies();let prevSide=null,streak=0;const streakCounts=[];for(const r of all){if(r.type==='timeout'){streakCounts.push(0);continue}if(r.side===prevSide)streak++;else{prevSide=r.side;streak=1}streakCounts.push(streak)}const offset=Math.max(0,all.length-20),shown=all.slice(-20);for(let i=0;i<20;i++){const r=shown[i];for(const [side,el] of [[0,ra],[1,rb]]){const cell=document.createElement('span');if(r&&r.type==='timeout'){cell.className='point timeout-point';cell.style.background='#84cc16';cell.style.color='#fff';cell.textContent=(r.kind==='team'&&r.side===side)?'TO':''}else{const isPoint=r&&r.side===side;cell.className='point '+(isPoint?(side===0?'a':'b')+(streakCounts[offset+i]>=3?' streak':''):'empty');if(isPoint&&streakCounts[offset+i]>=3)cell.style.color='#facc15';cell.textContent=isPoint?r.score[side]:''}el.appendChild(cell)}}const st=runStats(),runEl=$('currentRun');runEl.classList.remove('active','surge','team-a','team-b');if(timeoutActive()){runEl.textContent=timeoutLabel(all.find(r=>r.id===activeTimeout.id));runEl.style.background='#84cc16';runEl.style.color='#fff';runEl.style.borderColor='#84cc16'}else{runEl.style.background='';runEl.style.color='';runEl.style.borderColor='';if(st.last===null){runEl.textContent='まだ得点はありません'}else{const teamName=st.last===0?($('nameA').value||'Aチーム'):($('nameB').value||'Bチーム');if(st.run>=3){runEl.innerHTML='';const name=document.createElement('span');name.textContent=teamName+' ';const number=document.createElement('span');number.className='streak-number';number.textContent=st.run;const tail=document.createElement('span');tail.textContent=' 連続得点';runEl.append(name,number,tail);runEl.classList.add(st.last===0?'team-a':'team-b');if(st.run>=5)runEl.classList.add('surge');else runEl.classList.add('active')}else{runEl.textContent=teamName+' '+st.run+'連続得点'}}}$('maxA').textContent=st.max[0];$('maxB').textContent=st.max[1];}
function snapshot(){history.push({setNo,scores:JSON.parse(JSON.stringify(scores)),rallies:JSON.parse(JSON.stringify(rallies)),setWins:[...setWins]})}
function add(side){snapshot();current()[side]++;currentRallies().push({side,score:[...current()]});renderUI()}
function undo(){if(!history.length)return;const h=history.pop();setNo=h.setNo;scores=h.scores;rallies=h.rallies;setWins=h.setWins;if(activeTimeout&&!timeoutActive()){activeTimeout=null;if(timeoutTimer)clearTimeout(timeoutTimer);timeoutTimer=null}renderUI()}
function drawEndCard(){
 const w=canvas.width,h=canvas.height,rs=currentRallies(),a=current()[0],b=current()[1];let prevSide=null,streak=0;const streakCounts=rs.map(r=>{if(r.type==='timeout')return 0;if(r.side===prevSide)streak++;else{prevSide=r.side;streak=1}return streak});
 ctx.fillStyle='#07111f';ctx.fillRect(0,0,w,h);
 ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('第 '+setNo+' セット　得点経過',w/2,58);
 ctx.font='bold 54px sans-serif';ctx.fillText(a+' － '+b,w/2,122);
 ctx.font='bold 21px sans-serif';ctx.fillStyle='#38aaf5';ctx.textAlign='left';ctx.fillText(($('nameA').value||'チームA')+'　'+a+'点',34,166);
 ctx.fillStyle='#fb6464';ctx.textAlign='right';ctx.fillText(($('nameB').value||'チームB')+'　'+b+'点',w-34,166);
 const cols=20,blocks=Math.max(1,Math.ceil(rs.length/cols)),top=190,bottom=28,blockH=(h-top-bottom)/blocks;
 for(let block=0;block<blocks;block++){
   const y=top+block*blockH,from=block*cols,to=Math.min(rs.length,from+cols);
   if(blocks>1){ctx.textAlign='left';ctx.fillStyle='#a9b7ca';ctx.font='bold 13px sans-serif';ctx.fillText('記録 '+(from+1)+'～'+to,28,y+12)}
   const labelY=y+(blocks>1?22:0),laneH=Math.max(18,Math.min(42,(blockH-(blocks>1?28:8)-8)/2)),gap=4;
   const cellW=(w-56-(cols-1)*gap)/cols;
   for(let i=0;i<cols;i++){
     const r=rs[from+i],x=28+i*(cellW+gap);
     for(let side=0;side<2;side++){
       const yy=labelY+side*(laneH+5);
       if(r&&r.type==='timeout'){ctx.fillStyle='#84cc16';ctx.fillRect(x,yy,cellW,laneH);if(r.kind==='team'&&r.side===side){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold '+Math.max(10,Math.min(18,laneH*.48))+'px sans-serif';ctx.fillText('TO',x+cellW/2,yy+laneH*.68)}}else{ctx.fillStyle=r&&r.side===side?(side===0?'#168fe0':'#ef4444'):'rgba(148,163,184,.12)';ctx.fillRect(x,yy,cellW,laneH);if(r&&r.type!=='timeout'&&r.side===side){ctx.fillStyle=streakCounts[from+i]>=3?'#facc15':'#fff';ctx.textAlign='center';ctx.font='bold '+Math.max(11,Math.min(20,laneH*.55))+'px sans-serif';ctx.fillText(String(r.score[side]),x+cellW/2,yy+laneH*.68)}}
     }
   }
 }
 ctx.textAlign='center';ctx.fillStyle='#cbd5e1';ctx.font='16px sans-serif';ctx.fillText('青：'+($('nameA').value||'チームA')+'　／　赤：'+($('nameB').value||'チームB'),w/2,h-8);
}
function draw(){
 const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
 if(endCard){drawEndCard();raf=requestAnimationFrame(draw);return}
 if(cameraOn&&video.readyState>=2){const vw=video.videoWidth,vh=video.videoHeight,scale=Math.min(w/vw,h/vh),dw=vw*scale,dh=vh*scale;ctx.drawImage(video,(w-dw)/2,(h-dh)/2,dw,dh)}else{ctx.fillStyle='#07111f';ctx.fillRect(0,0,w,h);ctx.fillStyle='#94a3b8';ctx.textAlign='center';ctx.font='28px sans-serif';ctx.fillText('VOLLEY SCORE RECORDER',w/2,h/2)}
 const a=current()[0],b=current()[1],rs=currentRallies(),barH=220,y=h-barH;ctx.fillStyle='rgba(4,12,24,.88)';ctx.fillRect(0,y,w,barH);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 25px sans-serif';ctx.fillText('第 '+setNo+' セット',w/2,y+28);ctx.textAlign='left';ctx.font='bold 26px sans-serif';ctx.fillStyle='#38aaf5';ctx.fillText(($('nameA').value||'チームA').slice(0,10)+'  '+a,24,y+62);ctx.textAlign='right';ctx.fillStyle='#fb6464';ctx.fillText(($('nameB').value||'チームB').slice(0,10)+'  '+b,w-24,y+62);
 const shown=rs.slice(-20),cellW=Math.min(48,Math.max(34,(w-48-19*5)/20)),gap=5,total=20*(cellW+gap)-gap,left=(w-total)/2;ctx.textAlign='left';for(let i=0;i<20;i++){const r=shown[i],x=left+i*(cellW+gap);for(const side of [0,1]){const yy=side===0?y+78:y+116;if(r&&r.type==='timeout'){ctx.fillStyle='#84cc16';ctx.fillRect(x,yy,cellW,29);if(r.kind==='team'&&r.side===side){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 13px sans-serif';ctx.fillText('TO',x+cellW/2,yy+20)}}else{ctx.fillStyle=r&&r.side===side?(side===0?'#168fe0':'#ef4444'):'rgba(148,163,184,.12)';ctx.fillRect(x,yy,cellW,29);if(r&&r.side===side){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillText(String(r.score[side]),x+cellW/2,yy+20)}}}}
 const st=runStats();if(timeoutActive()){const t=rs.find(r=>r.id===activeTimeout.id),msg=timeoutLabel(t);ctx.font='bold 25px sans-serif';const tw=ctx.measureText(msg).width+40,tx=(w-tw)/2,ty=y+156;ctx.fillStyle='#84cc16';ctx.fillRect(tx,ty,tw,42);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(msg,w/2,ty+21);ctx.textBaseline='alphabetic'}else if(st.last!==undefined&&st.run>=3){const teamName=st.last===0?($('nameA').value||'Aチーム'):($('nameB').value||'Bチーム');const fs=st.run>=5?25:21;ctx.font='bold '+fs+'px sans-serif';const prefix=teamName+' ',number=String(st.run),suffix=' 連続得点！';const pw=ctx.measureText(prefix).width,nw=ctx.measureText(number).width,sw=ctx.measureText(suffix).width,tw=pw+nw+sw+38,th=42,x=(w-tw)/2,yy=y+156;ctx.fillStyle='rgba(38,52,73,.96)';ctx.fillRect(x,yy,tw,th);ctx.lineWidth=st.run>=5?4:3;ctx.strokeStyle=st.last===0?'#168fe0':'#ef4444';ctx.strokeRect(x,yy,tw,th);let tx=x+19;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(prefix,tx,yy+th/2);tx+=pw;ctx.fillStyle='#facc15';ctx.font='900 '+(fs+3)+'px sans-serif';ctx.fillText(number,tx,yy+th/2);tx+=nw;ctx.font='bold '+fs+'px sans-serif';ctx.fillStyle='#fff';ctx.fillText(suffix,tx,yy+th/2);ctx.textBaseline='alphabetic'}
 if(recorder&&recorder.state==='recording'){ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(42,42,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 24px sans-serif';ctx.fillText('REC',65,50)}raf=requestAnimationFrame(draw)
}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:true});video.srcObject=stream;await video.play();cameraOn=true;$('placeholder').classList.add('hidden');$('startRec').disabled=false;$('statusText').textContent='カメラ準備完了';$('dot').classList.add('live')}catch(e){alert('カメラを起動できませんでした。Safariのカメラ許可をご確認ください。\n'+e.message)}}
function chooseMime(){const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'];return types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||''}
function startRecording(){if(!cameraOn)return;try{const out=canvas.captureStream(30);stream.getAudioTracks().forEach(t=>out.addTrack(t));const mime=chooseMime();recorder=new MediaRecorder(out,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onstop=()=>{endCard=false;const type=recorder.mimeType||'video/webm',ext=type.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type});recordedFile=new File([blob],'volley-match-'+Date.now()+'.'+ext,{type});const btn=$('download');btn.textContent=ext==='mp4'?'写真アプリに保存する（MP4）':'動画を共有・保存する（WebM）';btn.classList.remove('hidden');$('statusText').textContent='録画完了。保存ボタンを押してください';$('dot').classList.remove('live')};recorder.start(1000);startedAt=Date.now();timer=setInterval(()=>{let s=Math.floor((Date.now()-startedAt)/1000);$('recTime').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);$('startRec').disabled=true;$('stopRec').disabled=false;$('statusText').textContent='録画中'}catch(e){alert('録画を開始できませんでした。\n'+e.message)}}
function stopRecording(){if(!recorder||recorder.state==='inactive')return;$('stopRec').disabled=true;$('statusText').textContent='セット全体の得点経過を5秒間記録しています';endCard=true;clearInterval(timer);if(endTimer)clearTimeout(endTimer);endTimer=setTimeout(()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();$('startRec').disabled=false},5000)}
$('download').onclick=async()=>{if(!recordedFile){alert('保存できる動画がありません。先に録画してください。');return}try{if(navigator.canShare&&navigator.canShare({files:[recordedFile]})&&navigator.share){await navigator.share({files:[recordedFile],title:'バレーボール試合動画'});$('statusText').textContent='共有メニューを開きました。写真に保存してください'}else{const url=URL.createObjectURL(recordedFile),a=document.createElement('a');a.href=url;a.download=recordedFile.name;document.body.appendChild(a);a.click();a.remove();$('statusText').textContent='動画をダウンロードしました。ファイルアプリを確認してください';setTimeout(()=>URL.revokeObjectURL(url),60000)}}catch(e){if(e.name!=='AbortError')alert('保存メニューを開けませんでした。'+e.message)}};$('startCamera').onclick=startCamera;$('startRec').onclick=startRecording;$('stopRec').onclick=stopRecording;$('addA').onclick=()=>add(0);$('addB').onclick=()=>add(1);$('timeoutA').onclick=()=>addTimeout('team',0);$('timeoutT').onclick=()=>addTimeout('technical',null);$('timeoutB').onclick=()=>addTimeout('team',1);$('nameA').addEventListener('input',renderUI);$('nameB').addEventListener('input',renderUI);$('undo').onclick=undo;$('nextSet').onclick=()=>{if(setNo<5){setNo++;ensureSet(setNo);renderUI()}};$('prevSet').onclick=()=>{if(setNo>1){setNo--;renderUI()}};$('resetSet').onclick=()=>{if(confirm('現在のセットの得点と得点経過をリセットしますか？')){snapshot();scores[setNo-1]=[0,0];rallies[setNo-1]=[];if(activeTimeout&&!timeoutActive()){activeTimeout=null;if(timeoutTimer)clearTimeout(timeoutTimer);timeoutTimer=null}renderUI()}};$('resetAll').onclick=()=>{if(confirm('全セットの得点と得点経過をリセットしますか？')){history=[];scores=[[0,0]];rallies=[[]];setNo=1;setWins=[0,0];activeTimeout=null;if(timeoutTimer)clearTimeout(timeoutTimer);timeoutTimer=null;renderUI()}};renderUI();draw();window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
</script></body></html>
